name: Bug report
description: Something doesn't work
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Phone, OS version and browser
      placeholder: Samsung A10, Android 11, Chrome 120
    validations:
      required: true
  - type: dropdown
    id: offline
    attributes:
      label: Were you offline?
      options: ["No", "Yes", "Not sure"]
