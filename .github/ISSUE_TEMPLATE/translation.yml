name: Translate Pharos
description: Offer or request a new language
title: "Translation: "
labels: ["i18n", "good first issue"]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: What will you translate?
      options:
        - label: The interface (src/i18n/<lang>.json)
        - label: The guides (content/guides/*.yaml)
        - label: The kit list (content/kit.yaml)
