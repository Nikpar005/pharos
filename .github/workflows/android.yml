name: Android app

# Builds an installable APK.
# - Every push to main (that touches the app) and "Run workflow": the APK is
#   attached to the run as an artifact.
# - Pushing a tag like v0.3.0: the APK is also published on the Releases
#   page, with a fixed download link:
#   https://github.com/Nikpar005/pharos/releases/latest/download/pharos.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', 'src/**', 'content/**', 'capacitor.config.ts', 'package.json', 'package-lock.json']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used to publish a Release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Build web app
        run: npm run build
      - name: Copy web app into Android project
        run: npx cap sync android

      # Optional: the release key, stored as repository secrets (docs/ANDROID.md).
      # Without it the APK is signed with a temporary test key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pharos.jks"
            echo "PHAROS_KEYSTORE=$RUNNER_TEMP/pharos.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "SIGNED_WITH=test key (add the signing secrets for updatable builds)" >> "$GITHUB_ENV"
          fi

      - name: Build APK and App Bundle
        working-directory: android
        env:
          PHAROS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PHAROS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PHAROS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/pharos.apk
          cp out/pharos.apk "out/pharos-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/pharos-$VERSION.aab"
          (cd out && sha256sum pharos.apk > pharos.apk.sha256)

      - name: Size report
        run: |
          mb() { awk "BEGIN { printf \"%.1f MB\", $(stat -c %s "$1") / 1000000 }"; }
          {
            echo "## Pharos $VERSION for Android"
            echo
            echo "| File | Size | What it is |"
            echo "|---|---|---|"
            echo "| pharos.apk | $(mb out/pharos.apk) | Install it on a phone. Signed with: $SIGNED_WITH |"
            echo "| pharos-$VERSION.aab | $(mb out/pharos-$VERSION.aab) | What you upload to Google Play |"
            echo
            echo "Web files inside the app: $(du -sh android/app/src/main/assets/public | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pharos-${{ env.VERSION }}-apk
          path: out/pharos.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: pharos-${{ env.VERSION }}-play-bundle
          path: out/pharos-*.aab
          retention-days: 30

      - name: Publish on the Releases page
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          **Download:** \`pharos.apk\` below. On the phone, open it and allow "Install unknown apps" for your browser or Files app.

          Signed with: $SIGNED_WITH. SHA-256 is in \`pharos.apk.sha256\`.

          The web version needs no install: https://nikpar005.github.io/pharos/
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/pharos.apk "out/pharos-$VERSION.apk" out/pharos.apk.sha256 --clobber
          else
            gh release create "$TAG" out/pharos.apk "out/pharos-$VERSION.apk" out/pharos.apk.sha256 \
              --title "Pharos $TAG" --notes-file notes.md --generate-notes
          fi
