name: Build offline maps

# Cuts each region in content/regions.yaml out of the latest OpenStreetMap
# build from Protomaps, reports the sizes, and stores the files as assets of
# the "maps" release. The Pages deploy then serves them at /maps/<id>.pmtiles.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # monthly refresh

permissions:
  contents: write

jobs:
  maps:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install pmtiles CLI
        run: |
          gh release download --repo protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' --dir /tmp/pmtiles
          tar -xzf /tmp/pmtiles/*.tar.gz -C /tmp/pmtiles
          sudo mv /tmp/pmtiles/pmtiles /usr/local/bin/pmtiles
          pmtiles version || true

      - name: Find the latest Protomaps build
        id: source
        run: |
          for i in $(seq 0 14); do
            d=$(date -u -d "-$i day" +%Y%m%d)
            if curl -sfI "https://build.protomaps.com/$d.pmtiles" > /dev/null; then
              echo "url=https://build.protomaps.com/$d.pmtiles" >> "$GITHUB_OUTPUT"
              echo "Using build $d"
              exit 0
            fi
          done
          echo "No Protomaps build found in the last 15 days" && exit 1

      - name: Extract regions
        run: |
          mkdir -p out
          node scripts/regions.mjs > regions.tsv
          {
            echo "## Offline map sizes"
            echo
            echo "| Region | Max zoom | Map | Emergency places |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r id bbox maxzoom; do
            pmtiles extract "${{ steps.source.outputs.url }}" "out/$id.pmtiles" --bbox="$bbox" --maxzoom="$maxzoom"
            # Emergency places for "Nearby" (Overpass wants south,west,north,east).
            IFS=, read -r w s e n <<< "$bbox"
            q="[out:json][timeout:300];(nwr[\"amenity\"~\"^(hospital|clinic|pharmacy|police|fire_station)$\"]($s,$w,$n,$e);nwr[\"emergency\"=\"assembly_point\"]($s,$w,$n,$e););out center tags;"
            curl -sf --retry 3 --retry-delay 20 -H 'User-Agent: Pharos map build (github.com/${{ github.repository }})' \
              --data-urlencode "data=$q" https://overpass-api.de/api/interpreter -o "out/$id.overpass.json"
            node scripts/pois.mjs "out/$id.overpass.json" > "out/$id.pois.json"
            rm "out/$id.overpass.json"
            size=$(awk "BEGIN { printf \"%.1f MB\", $(stat -c %s "out/$id.pmtiles") / 1000000 }")
            psize=$(awk "BEGIN { printf \"%.0f KB\", $(stat -c %s "out/$id.pois.json") / 1000 }")
            echo "| $id | $maxzoom | $size | $psize |" >> "$GITHUB_STEP_SUMMARY"
          done < regions.tsv
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${{ steps.source.outputs.url }} · © OpenStreetMap contributors (ODbL)" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Publish to the "maps" release
        run: |
          gh release view maps > /dev/null 2>&1 || gh release create maps --title "Offline maps" --notes "Map files for the app. © OpenStreetMap contributors (ODbL). Rebuilt monthly." --latest=false
          gh release upload maps out/*.pmtiles out/*.pois.json --clobber
