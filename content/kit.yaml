    locales:
      el: { title: Υγεία }
      en: { title: Health }
    items:
      - id: first-aid
        locales:
          el: { label: Φαρμακείο πρώτων βοηθειών }
          en: { label: First aid kit }
      - id: medicines
        locales:
          el: { label: Φάρμακα που παίρνεις, για 7 μέρες }
          en: { label: Your regular medicines, for 7 days }
      - id: masks
        locales:
          el: { label: Μάσκες προστασίας από σκόνη και καπνό }
          en: { label: Masks for dust and smoke }
