        locales:
          el: { label: Ζεστά ρούχα και γερά παπούτσια }
          en: { label: Warm clothes and sturdy shoes }
      - id: blanket
        locales:
          el: { label: Κουβέρτα ή ισοθερμική κουβέρτα }
          en: { label: Blanket or emergency foil blanket }
      - id: multitool
        locales:
          el: { label: Σουγιάς ή πολυεργαλείο }
          en: { label: Pocket knife or multitool }
