status: draft
sources:
  - name: Γενική Γραμματεία Πολιτικής Προστασίας
    url: https://civilprotection.gov.gr
  - name: European Commission, Preparedness Union Strategy
    url: https://commission.europa.eu/topics/preparedness_en
groups:
  - id: water-food
    locales:
      el: { title: Νερό και τροφή }
      en: { title: Water and food }
    items:
      - id: water
        locales:
          el: { label: "Νερό: 4 λίτρα ανά άτομο τη μέρα, για 3 μέρες" }
          en: { label: "Water: 4 litres per person per day, for 3 days" }
      - id: food
        locales:
          el: { label: Τρόφιμα που δεν χαλάνε, για 3 μέρες }
          en: { label: Food that keeps, for 3 days }
      - id: can-opener
        locales:
          el: { label: Ανοιχτήρι κονσέρβας }
          en: { label: Can opener }
  - id: light-comms
    locales:
      el: { title: Φως και επικοινωνία }
      en: { title: Light and communication }
    items:
      - id: torch
        locales:
          el: { label: Φακός και εφεδρικές μπαταρίες }
          en: { label: Torch and spare batteries }
      - id: radio
        locales:
          el: { label: Ραδιόφωνο μπαταρίας }
          en: { label: Battery-powered radio }
      - id: powerbank
        locales:
          el: { label: Powerbank, φορτισμένο }
          en: { label: Charged power bank }
      - id: whistle
        locales:
          el: { label: Σφυρίχτρα }
          en: { label: Whistle }
